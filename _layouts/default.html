<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>

  <body{% if page.body_style %} style="{{ page.body_style }}"{% endif %}>
    {% include header.html %}

    {{ content }}

    {% include footer.html %}

    <script src="assets/js/main.js"></script>
    {%- if page.scene %}
    <script type="module" src="assets/js/scenes/{{ page.scene }}.js"></script>
    {%- endif %}
  </body>
</html>
