<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 60 1200 628.38" role="img" aria-label="Ringed planet with a moon, comets and stars">
  <!-- Colors from the illustration palette, Nebulosa Brand Guidelines v1.0 p.5-7. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4a257d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4a257d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e94884"/>
      <stop offset=".75" stop-color="#5c2684"/>
    </linearGradient>
    <linearGradient id="planet-sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e3e6e5"/>
      <stop offset="1" stop-color="#908cc3"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a257d"/>
      <stop offset=".5" stop-color="#908cc3"/>
      <stop offset="1" stop-color="#5c2684"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e94884"/>
      <stop offset="1" stop-color="#4a257d"/>
    </linearGradient>
    <linearGradient id="comet-gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fab600" stop-opacity="0"/>
      <stop offset="1" stop-color="#fab600"/>
    </linearGradient>
    <linearGradient id="comet-coral" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eb5c5f" stop-opacity="0"/>
      <stop offset="1" stop-color="#eb5c5f"/>
    </linearGradient>
    <clipPath id="planet-clip"><circle cx="760" cy="393" r="220"/></clipPath>
    <!-- Front half of the ring: the part of the ellipse below its major axis. -->
    <clipPath id="ring-front"><rect x="300" y="393" width="920" height="200"/></clipPath>
    <path id="sparkle" d="M0-18C2-6 6-2 18 0 6 2 2 6 0 18-2 6-6 2-18 0-6-2-2-6 0-18Z"/>
  </defs>

  <style>
    .float { animation: float 9s ease-in-out infinite alternate; }
    .float-slow { animation: float 13s ease-in-out infinite alternate-reverse; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.d1 { animation-delay: -1.1s; }
    .twinkle.d2 { animation-delay: -2.3s; }
    .comet { animation: comet 7s ease-in-out infinite; }
    .comet.d1 { animation-delay: -3.5s; }
    @keyframes float { to { transform: translateY(-14px); } }
    @keyframes twinkle { 50% { opacity: .35; transform: scale(.7); } }
    @keyframes comet { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle cx="760" cy="393" r="380" fill="url(#glow)"/>

  <!-- Background specks -->
  <g fill="none" stroke-linecap="round" stroke-width="4">
    <circle cx="330" cy="150" r="9" stroke="#d77969"/>
    <circle cx="1180" cy="120" r="8" stroke="#908cc3"/>
    <circle cx="560" cy="700" r="7" stroke="#d77969"/>
    <path d="M1260 330q8-8 16 0t16 0" stroke="#8585b9"/>
    <path d="M430 90q8-8 16 0t16 0" stroke="#8585b9"/>
    <path d="M1010 720q8-8 16 0t16 0" stroke="#8585b9"/>
    <path d="M250 520q8-8 16 0t16 0" stroke="#8585b9"/>
  </g>
  <g fill="#fff">
    <circle cx="480" cy="210" r="3"/>
    <circle cx="1090" cy="210" r="3"/>
    <circle cx="1350" cy="480" r="2.5"/>
    <circle cx="380" cy="620" r="2.5"/>
    <circle cx="960" cy="80" r="2"/>
  </g>

  <!-- Comets -->
  <g stroke-linecap="round" stroke-width="7">
    <path class="comet" d="M1330 560 1240 650" stroke="url(#comet-gold)"/>
    <path class="comet d1" d="M1390 610 1335 665" stroke="url(#comet-coral)" stroke-width="5"/>
  </g>
  <g>
    <path d="M300 300h-46" stroke="#e94884" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <circle cx="306" cy="300" r="8" fill="#e94884"/>
    <path d="M620 640h-40" stroke="#e94884" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <circle cx="626" cy="640" r="7" fill="#e94884"/>
  </g>

  <!-- Planet with its ring -->
  <g class="float">
    <g transform="rotate(-18 760 393)">
      <ellipse cx="760" cy="393" rx="400" ry="64" fill="none" stroke="url(#ring)" stroke-width="14"/>
    </g>

    <g clip-path="url(#planet-clip)">
      <rect x="520" y="160" width="480" height="480" fill="url(#planet-top)"/>
      <path d="M520 380c60-40 120 20 190-5s110-60 170-20 90 30 140 10V640H520Z" fill="url(#planet-sea)"/>
      <path d="M520 470c70-30 130 30 210 0s120-40 180-5 60 20 110 5V640H520Z" fill="#908cc3" opacity=".35"/>
      <g fill="#908cc3" opacity=".45">
        <circle cx="640" cy="455" r="14"/>
        <circle cx="820" cy="520" r="10"/>
        <circle cx="720" cy="560" r="7"/>
        <circle cx="890" cy="440" r="6"/>
      </g>
    </g>
    <path d="M628 250a190 190 0 0 1 90-60" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".85"/>
    <circle cx="738" cy="186" r="7" fill="#fff" opacity=".85"/>

    <g transform="rotate(-18 760 393)" clip-path="url(#ring-front)">
      <ellipse cx="760" cy="393" rx="400" ry="64" fill="none" stroke="url(#ring)" stroke-width="14"/>
    </g>
  </g>

  <!-- Moon -->
  <g class="float-slow">
    <circle cx="1040" cy="560" r="46" fill="url(#moon)"/>
    <path d="M1012 536a34 34 0 0 1 20-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- Sparkles -->
  <use href="#sparkle" class="twinkle" x="400" y="380" fill="#fff"/>
  <use href="#sparkle" class="twinkle d1" x="1150" y="270" fill="#fff" transform="translate(575 135) scale(.5)"/>
  <use href="#sparkle" class="twinkle d2" x="1000" y="700" fill="#fff48c" transform="translate(500 350) scale(.5)"/>
  <use href="#sparkle" class="twinkle d1" x="560" y="120" fill="#fff" transform="translate(280 60) scale(.5)"/>
</svg>
