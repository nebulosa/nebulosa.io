<!doctype html>
<!-- A layout the wide gate must reject: full-bleed sections whose only child is a wrapper capped at 1280px. The
     section's box is as wide as the screen; the content is not. -->
<html lang="en"><head><meta charset="utf-8"><title>wide: broken</title>
<style>body{margin:0}.nb-main>section{padding:0 24px}.inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px}</style>
</head><body class="nb">
<main class="nb-main">
  <section><div class="inner"><p>one</p><p>two</p></div></section>
  <section><div class="inner"><h2>a</h2><p>b</p><p>c</p></div></section>
</main>
</body></html>
