<!doctype html>
<!-- The same structure with the wrapper allowed to grow to 1600px: the content uses the width. -->
<html lang="en"><head><meta charset="utf-8"><title>wide: ok</title>
<style>body{margin:0}.nb-main>section{padding:0 24px}.inner{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px}</style>
</head><body class="nb">
<main class="nb-main">
  <section><div class="inner"><p>one</p><p>two</p></div></section>
  <section><div class="inner"><h2>a</h2><p>b</p><p>c</p></div></section>
</main>
</body></html>
